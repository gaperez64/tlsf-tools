name: Required native dependencies
description: Install Rust and cbindgen for every libtlsf build.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with: {toolchain: '1.91.0'}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: external/oxidd -> target
        cache-targets: false
        key: native-${{ runner.os }}-${{ runner.arch }}-1.91.0-0.29.4-${{ hashFiles('external/oxidd/Cargo.lock') }}
    - name: Install cbindgen
      shell: bash
      run: cargo install cbindgen --version 0.29.4 --locked
