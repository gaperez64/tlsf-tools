name: Required native dependencies
description: Install Rust, cbindgen and Spot for every libtlsf build.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with: {toolchain: '1.91.0'}
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: external/oxidd -> target
        cache-targets: false
        key: native-${{ runner.os }}-${{ runner.arch }}-1.91.0-0.29.4-${{ hashFiles('external/oxidd/Cargo.lock') }}
    - name: Install cbindgen
      shell: bash
      run: cargo install cbindgen --version 0.29.4 --locked
    - uses: actions/cache@v6
      id: spot
      with:
        path: .spot
        key: spot-2.16-${{ runner.os }}-${{ runner.arch }}-native-v1
    - name: Build Spot
      if: steps.spot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make curl g++-14
          export CC=gcc-14 CXX=g++-14
        else
          brew install autoconf automake libtool
        fi
        curl -fsSL https://www.lre.epita.fr/dload/spot/spot-2.16.tar.gz -o spot-2.16.tar.gz
        tar -xf spot-2.16.tar.gz
        cd spot-2.16
        ./configure --disable-python --prefix="$GITHUB_WORKSPACE/.spot"
        make -j4
        make install
    - name: Export Spot paths
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.spot/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.spot/lib" >> "$GITHUB_ENV"
