name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pin clang-format via the PyPI package so the formatting check is
      # reproducible across machines (distro clang-format versions disagree).
      - name: Install clang-format
        run: pip install 'clang-format==22.1.8'
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z --cached --others --exclude-standard -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' \
            ':!:external/**' ':!:build*/**' |
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then printf '%s\0' "$file"; fi
          done | xargs -0 -r clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 valgrind
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: meson setup build
      - name: Build
        run: ninja -C build
      - name: Run regression tests
        run: meson test -C build --print-errorlogs
      - name: Memory check (valgrind, no leaks/errors)
        run: |
          set -e
          for args in \
            "tlsf2ltl test/fixtures/cases/Patterns_Uright_uright06.tlsf" \
            "tlsf2ltl --parenthesize test/fixtures/cases/Random_Lydia_case_03_50_05.tlsf" \
            "tlsf2ltl test/fixtures/cases/operators.tlsf" \
            "tlsf2tlsf test/fixtures/cases/defs.tlsf" \
            "tlsfinfo --generalized-reactivity test/fixtures/cases/gr4_spec.tlsf" \
            "mealy2moore test/fixtures/cases/mealy2moore_simple.in.aag" \
            "tlsf2tlsf --param n=5 test/fixtures/cases/param_demo.tlsf"; do
            echo "valgrind: $args"
            valgrind --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite,indirect ./build/$args >/dev/null
          done

  build-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison clang
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure, build and test
        env:
          CC: clang
        run: |
          meson setup build-clang
          ninja -C build-clang
          meson test -C build-clang --print-errorlogs

  simd-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpu: [baseline, x86-64-v2, avx2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure, build, and test SIMD kernels
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup build-simd-${{ matrix.cpu }} -Dcpu=${{ matrix.cpu }}
          meson compile -C build-simd-${{ matrix.cpu }} simd_check
          meson test -C build-simd-${{ matrix.cpu }} simd_kernels --print-errorlogs

  # Exercise the research executables and the Spot-verified native solvers.
  build-oxidd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 python3
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure, build and test (OxiDD enabled, AVX2 SIMD)
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          # GitHub x86 runners are Haswell+ (AVX2-safe); exercises the
          # compile-time SIMD path in src/lib/simd.h.
          meson setup build-oxidd -Dresearch_tools=true -Dcpu=avx2
          ninja -C build-oxidd
          meson test -C build-oxidd --print-errorlogs

  build-native-gr1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14 make curl pkg-config
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Build and test native C ABI
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          pkg-config --modversion libspot
          git rev-parse HEAD
          git -C external/oxidd rev-parse HEAD
          meson setup build-native-ci \
            -Dresearch_tools=true -Dcpp_std=c++20
          meson compile -C build-native-ci -j1
          meson test -C build-native-ci --num-processes 1 --print-errorlogs
          # The configuration Acacia-Bonsai builds as a subproject.
          meson setup build-native-lib \
            -Dresearch_tools=false -Dcpp_std=c++23
          meson compile -C build-native-lib -j1

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc gcovr
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Build with coverage and report
        run: |
          # Cover the complete library and research executables.
          meson setup build-cov -Db_coverage=true -Dresearch_tools=true
          meson test -C build-cov
          summary=$(gcovr --root . \
            --filter 'src/' --exclude '.*tlsf_(lex|parse).*' \
            --exclude '.*aiger\.c' \
            --print-summary 2>&1) || true
          echo "$summary"
          pct=$(echo "$summary" | grep -oE 'lines: [0-9.]+%' | grep -oE '[0-9.]+')
          echo "parsed line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 75) { print "FAIL: line coverage below 75%"; exit 1 } }'

  perf-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 time
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup build
          ninja -C build
      - name: Perf regression guard (no syfco needed)
        run: bench/bench.sh --check
