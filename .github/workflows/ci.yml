name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pin clang-format via the PyPI package so the formatting check is
      # reproducible across machines (distro clang-format versions disagree).
      - name: Install clang-format
        run: pip install 'clang-format==22.1.8'
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z --cached --others --exclude-standard -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' \
            ':!:external/**' ':!:build*/**' |
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then printf '%s\0' "$file"; fi
          done | xargs -0 -r clang-format --dry-run --Werror

  # Build the vendored OxiDD C FFI (Rust staticlib + cbindgen header) exactly
  # once and share it with the explicit OxiDD research job as an artifact, so
  # cargo runs a single time per CI run. The stable jobs stay on the default
  # no-Rust production path.
  oxidd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: OxiDD submodule revision
        id: rev
        run: echo "sha=$(git -C external/oxidd rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache cargo + OxiDD build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            external/oxidd/target
          key: oxidd-gc-thread-retirement-${{ runner.os }}-rust-1.98.1-cbindgen-0.29.2-${{ steps.rev.outputs.sha }}-${{ hashFiles('scripts/build_oxidd.sh', 'patches/oxidd-gc-thread-retirement.patch') }}
      - name: Install cbindgen
        run: |
          if ! command -v cbindgen >/dev/null || \
             [ "$(cbindgen --version)" != 'cbindgen 0.29.2' ]; then
            cargo install cbindgen --version 0.29.2 --locked --force
          fi
          test "$(cbindgen --version)" = 'cbindgen 0.29.2'
      - name: Build OxiDD FFI
        run: scripts/build_oxidd.sh
      - name: Upload OxiDD FFI artifact
        uses: actions/upload-artifact@v7
        with:
          name: oxidd-ffi
          path: |
            external/oxidd/target/release/liboxidd_ffi_c.a
            external/oxidd/build/include
            external/oxidd/build/oxidd-gc-thread-retirement-info.txt
          if-no-files-found: error
          retention-days: 1

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 valgrind
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure
        env:
          CC: gcc-14
        run: meson setup build -Doxidd=disabled
      - name: Build
        run: ninja -C build
      - name: Run regression tests
        run: meson test -C build --print-errorlogs
      - name: Memory check (valgrind, no leaks/errors)
        run: |
          set -e
          for args in \
            "tlsf2ltl test/fixtures/cases/Patterns_Uright_uright06.tlsf" \
            "tlsf2ltl --parenthesize test/fixtures/cases/Random_Lydia_case_03_50_05.tlsf" \
            "tlsf2ltl test/fixtures/cases/operators.tlsf" \
            "tlsf2tlsf test/fixtures/cases/defs.tlsf" \
            "tlsfinfo --generalized-reactivity test/fixtures/cases/gr4_spec.tlsf" \
            "mealy2moore test/fixtures/cases/mealy2moore_simple.in.aag" \
            "tlsf2tlsf --param n=5 test/fixtures/cases/param_demo.tlsf"; do
            echo "valgrind: $args"
            valgrind --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite,indirect ./build/$args >/dev/null
          done

  build-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison clang
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure, build and test
        env:
          CC: clang
        run: |
          meson setup build-clang -Doxidd=disabled
          ninja -C build-clang
          meson test -C build-clang --print-errorlogs

  simd-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpu: [baseline, x86-64-v2, avx2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Configure, build, and test SIMD kernels
        env:
          CC: gcc-14
        run: |
          meson setup build-simd-${{ matrix.cpu }} -Doxidd=disabled -Dcpu=${{ matrix.cpu }}
          meson compile -C build-simd-${{ matrix.cpu }} simd_check
          meson test -C build-simd-${{ matrix.cpu }} simd_kernels --print-errorlogs

  # OxiDD-enabled build: links the shared FFI artifact, compiles the in-process
  # safety + GR(1) solvers (src/lib/safety_oxidd.c, src/lib/gr1_oxidd.c,
  # src/lib/aiger.c via tlsfcompose/tlsfsolve) and runs the full research
  # suite. The Spot-verified verify_aiger_oxidd* tests auto-gate on Spot
  # (absent here) and run locally; bounded_synthesis_harness still exercises a
  # real in-process solve.
  build-oxidd:
    needs: oxidd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 python3
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Download OxiDD FFI artifact
        uses: actions/download-artifact@v8
        with:
          name: oxidd-ffi
          path: external/oxidd
      - name: Apply OxiDD source patch
        run: git -C external/oxidd apply ../../patches/oxidd-gc-thread-retirement.patch
      - name: Configure, build and test (OxiDD enabled, AVX2 SIMD)
        env:
          CC: gcc-14
        run: |
          # GitHub x86 runners are Haswell+ (AVX2-safe); exercises the
          # compile-time SIMD path in src/lib/simd.h.
          meson setup build-oxidd -Doxidd=enabled -Dresearch_tools=true -Dcpu=avx2
          ninja -C build-oxidd
          meson test -C build-oxidd --print-errorlogs

  build-native-gr1:
    needs: oxidd
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14 make curl pkg-config
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Download OxiDD FFI artifact
        uses: actions/download-artifact@v8
        with:
          name: oxidd-ffi
          path: external/oxidd
      - name: Apply OxiDD source patch
        run: git -C external/oxidd apply ../../patches/oxidd-gc-thread-retirement.patch
      - name: Build pinned Spot release
        run: |
          curl -fsSL https://www.lre.epita.fr/dload/spot/spot-2.16.tar.gz \
            -o spot-2.16.tar.gz
          tar -xf spot-2.16.tar.gz
          cd spot-2.16
          CC=gcc-14 CXX=g++-14 ./configure --disable-python \
            --prefix="$GITHUB_WORKSPACE/.spot"
          make -j2
          make install
      - name: Build and test native C ABI
        env:
          CC: gcc-14
          CXX: g++-14
          PKG_CONFIG_PATH: ${{ github.workspace }}/.spot/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/.spot/lib
        run: |
          pkg-config --modversion libspot
          git rev-parse HEAD
          git -C external/oxidd rev-parse HEAD
          meson setup build-native-ci -Dnative_gr1=enabled -Doxidd=enabled \
            -Dresearch_tools=true -Dcpp_std=c++20
          meson compile -C build-native-ci -j1
          meson test -C build-native-ci --num-processes 1 --print-errorlogs
          meson setup build-oxidd-ci -Dnative_gr1=disabled -Doxidd=enabled \
            -Dresearch_tools=true -Dcpp_std=c++20
          meson compile -C build-oxidd-ci -j1
          python3 test/api/check_native_gate.py build-oxidd-ci
          # The configuration Acacia-Bonsai builds as a subproject.
          meson setup build-native-lib -Dnative_gr1=enabled -Doxidd=enabled \
            -Dresearch_tools=false -Dcpp_std=c++23
          meson compile -C build-native-lib -j1

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc gcovr
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Build with coverage and report
        run: |
          # Coverage is measured on the dependency-free build with the
          # research CLIs enabled: they exercise graph/WL/template code without
          # requiring Rust/OxiDD. The OxiDD solver files compile only with
          # -Doxidd=enabled, and their correctness paths are exercised by the
          # Spot-verified suite (local). Enabling OxiDD here would add ~4k solver
          # lines to the denominator without Spot to cover them. Build and
          # measure with the runner's default gcc and its matching gcov; mixing
          # default gcc with gcov-14 makes gcov exit 3 and crashes gcovr. Gate on
          # the parsed line percentage.
          # aiger.c is excluded for the same reason as the solver files: it is an
          # OxiDD-path TU (the AIG game model) whose only callers
          # (tlsfcompose / csnf_emit_local_aiger) need -DHAVE_OXIDD, so it is
          # never exercised in this dependency-free build (0% here), yet it links
          # into the shared lib. It is covered by the local verify_aiger_oxidd*
          # suite. Counting its ~780 untestable-here lines just makes the gate
          # spuriously fragile.
          meson setup build-cov -Db_coverage=true -Dresearch_tools=true -Doxidd=disabled
          meson test -C build-cov
          summary=$(gcovr --root . \
            --filter 'src/' --exclude '.*tlsf_(lex|parse).*' \
            --exclude '.*aiger\.c' \
            --print-summary 2>&1) || true
          echo "$summary"
          pct=$(echo "$summary" | grep -oE 'lines: [0-9.]+%' | grep -oE '[0-9.]+')
          echo "parsed line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 75) { print "FAIL: line coverage below 75%"; exit 1 } }'

  perf-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 time
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - name: Build
        env:
          CC: gcc-14
        run: |
          meson setup build -Doxidd=disabled
          ninja -C build
      - name: Perf regression guard (no syfco needed)
        run: bench/bench.sh --check
