name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # 12 ccache namespaces at 100M leave room for Rust caches and older snapshots.
  CCACHE_DIR: ${{ github.workspace }}/.cache/ccache

# Keep every default-branch run, including pending runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Pin clang-format via the PyPI package so the formatting check is
      # reproducible across machines (distro clang-format versions disagree).
      - name: Install clang-format
        run: pip install 'clang-format==22.1.8'
      - name: Check formatting
        run: |
          clang-format --version
          git ls-files -z --cached --others --exclude-standard -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' \
            ':!:external/**' ':!:build*/**' |
          while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then printf '%s\0' "$file"; fi
          done | xargs -0 -r clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14 valgrind
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-build-test, max-size: 100M}
      - name: Configure
        env:
          CC: ccache gcc-14
          CXX: ccache g++-14
        run: meson setup build
      - name: Build
        run: ninja -C build
      - name: Run regression tests
        run: meson test -C build --print-errorlogs
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-order-gcc
          path: build/compiler-order/
          if-no-files-found: error
      - name: Memory check (valgrind, no leaks/errors)
        run: |
          set -e
          for args in \
            "tlsf2ltl test/fixtures/cases/Patterns_Uright_uright06.tlsf" \
            "tlsf2ltl --parenthesize test/fixtures/cases/Random_Lydia_case_03_50_05.tlsf" \
            "tlsf2ltl test/fixtures/cases/operators.tlsf" \
            "tlsf2tlsf test/fixtures/cases/defs.tlsf" \
            "tlsfinfo --generalized-reactivity test/fixtures/cases/gr4_spec.tlsf" \
            "mealy2moore test/fixtures/cases/mealy2moore_simple.in.aag" \
            "tlsf2tlsf --param n=5 test/fixtures/cases/param_demo.tlsf"; do
            echo "valgrind: $args"
            valgrind --error-exitcode=1 --leak-check=full \
              --errors-for-leak-kinds=definite,indirect ./build/$args >/dev/null
          done

  build-macos:
    runs-on: macos-15
    env:
      CARGO_BUILD_JOBS: '1'
      CCACHE_COMPILERCHECK: '%compiler% -v'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify arm64 runner and install toolchain
        run: |
          test "$(uname -m)" = arm64
          brew update
          brew install ninja flex bison
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-build-macos, max-size: 100M}
      - name: Build stable tools and library, then run regressions
        run: |
          CC="ccache ${CC:-cc}" CXX="ccache ${CXX:-c++}" \
            meson setup build-macos --buildtype=release -Dresearch_tools=false -Dcpu=neon
          meson compile -C build-macos -j1
          meson test -C build-macos --no-rebuild --num-processes 1 --print-errorlogs
      - name: Explain platform exclusions
        run: |
          echo 'SKIP dpa_contract, dpa_deadline, objective_alloc, native_api_failure: require GNU ld --wrap (objective_alloc also uses /proc/self/fd).'
          echo 'SKIP oxidd_runtime_*: Linux RLIMIT_AS worker-stack contract.'
          echo 'native_both_api RSS measurement/assertions run on macOS using Mach task_info and Darwin ru_maxrss byte units.'

  build-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison clang
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-build-clang, max-size: 100M}
      - name: Configure, build and test
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          meson setup build-clang
          python3 - <<'PY'
          import json, subprocess
          compilers = json.loads(subprocess.check_output(
              ['meson', 'introspect', '--compilers', 'build-clang']))['host']
          assert all(compilers[lang]['id'] == 'clang' for lang in ('c', 'cpp')), compilers
          PY
          ninja -C build-clang
          meson test -C build-clang --print-errorlogs
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-order-clang
          path: build-clang/compiler-order/
          if-no-files-found: error

  fuzz-replay-clang:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: '1'
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison clang
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-fuzz-replay-clang, max-size: 100M}
      - name: Configure, build and replay
        env:
          CC: ccache clang
          CXX: ccache clang++
        run: |
          meson setup build-fuzz-replay -Dfuzz=true
          ninja -C build-fuzz-replay -j 1
          meson test -C build-fuzz-replay --no-rebuild --num-processes 1 --print-errorlogs \
            source_layout fuzz-witness-roundtrip fuzz-witness-alloc fuzz-witness-dpa

  compiler-order:
    runs-on: ubuntu-24.04
    needs: [build-test, build-clang]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compiler-order-gcc
          path: gcc
      - uses: actions/download-artifact@v4
        with:
          name: compiler-order-clang
          path: clang
      - name: Compare GCC and Clang AAGs, game hashes and provenance
        run: diff -ru gcc clang

  simd-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpu: [baseline, x86-64-v2, avx2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: 'ci-simd-${{ matrix.cpu }}', max-size: 100M}
      - name: Configure, build, and test SIMD kernels
        env:
          CC: ccache gcc-14
          CXX: ccache g++-14
        run: |
          meson setup build-simd-${{ matrix.cpu }} -Dcpu=${{ matrix.cpu }}
          meson compile -C build-simd-${{ matrix.cpu }} simd_check
          meson test -C build-simd-${{ matrix.cpu }} simd_kernels --print-errorlogs

  # Exercise the research executables and native solvers against goldens.
  build-oxidd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14 python3
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-build-oxidd, max-size: 100M}
      - name: Configure, build and test (OxiDD enabled, AVX2 SIMD)
        env:
          CC: ccache gcc-14
          CXX: ccache g++-14
        run: |
          # GitHub x86 runners are Haswell+ (AVX2-safe); exercises the
          # compile-time SIMD path in src/lib/simd.h.
          meson setup build-oxidd -Dresearch_tools=true -Dcpu=avx2
          ninja -C build-oxidd
          meson test -C build-oxidd --print-errorlogs

  build-native-gr1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache-native-ci
        with: {key: ci-native-cpp20, max-size: 100M}
      - uses: hendrikmuhs/ccache-action@v1
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache-native-lib
        with: {key: ci-native-release-cpp23, max-size: 100M}
      - name: Build and test native C ABI
        env:
          CC: ccache gcc-14
          CXX: ccache g++-14
        run: |
          git rev-parse HEAD
          git -C external/oxidd rev-parse HEAD
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache-native-ci"
          meson setup build-native-ci \
            -Dresearch_tools=true -Dcpp_std=c++20
          meson compile -C build-native-ci -j1
          meson test -C build-native-ci --num-processes 1 --print-errorlogs
          # The configuration Acacia-Bonsai builds as a subproject.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.cache/ccache-native-lib"
          meson setup build-native-lib \
            --buildtype=release -Dresearch_tools=false -Dcpp_std=c++23
          meson compile -C build-native-lib -j1
          meson test -C build-native-lib --no-rebuild --num-processes 1 --print-errorlogs

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc gcovr
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-coverage, max-size: 100M}
      - name: Build with coverage and report
        run: |
          # Cover the complete library and research executables.
          CC="ccache ${CC:-cc}" CXX="ccache ${CXX:-c++}" \
            meson setup build-cov -Db_coverage=true -Dresearch_tools=true
          meson test -C build-cov --print-errorlogs
          summary=$(gcovr --root . \
            --filter 'src/' --exclude '.*tlsf_(lex|parse).*' \
            --exclude '.*aiger\.c' \
            --print-summary 2>&1) || true
          echo "$summary"
          pct=$(echo "$summary" | grep -oE 'lines: [0-9.]+%' | grep -oE '[0-9.]+')
          echo "parsed line coverage: ${pct}%"
          awk -v p="$pct" 'BEGIN{ if (p+0 < 75) { print "FAIL: line coverage below 75%"; exit 1 } }'

  perf-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build flex bison gcc-14 g++-14 time
      - uses: ./.github/actions/setup-native
      - name: Install Meson
        run: pip install 'meson==1.12.1'
      - uses: hendrikmuhs/ccache-action@v1
        with: {key: ci-perf-regression, max-size: 100M}
      - name: Build
        env:
          CC: ccache gcc-14
          CXX: ccache g++-14
        run: |
          meson setup build
          ninja -C build
      - name: Perf regression guard (no syfco needed)
        run: bench/bench.sh --check
